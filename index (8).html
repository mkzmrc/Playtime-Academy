<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Théories – Playtime Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Nunito', Arial, sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.5; padding: 40px 20px; }
    .toolbar { position: fixed; top: 16px; right: 16px; display: flex; gap: 10px; z-index: 100; }
    .btn { padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; text-decoration: none; border: none; cursor: pointer; font-family: inherit; }
    .btn-print { background: #3b82f6; color: white; }
    .btn-back { background: #e2e8f0; color: #1e293b; }
    .page { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .subtitle { color: #64748b; margin-bottom: 20px; font-size: 13px; }
    .info { display: flex; gap: 20px; margin-bottom: 24px; font-size: 13px; }
    .info span { border-bottom: 1px solid #cbd5e1; min-width: 140px; display: inline-block; }
    h2 { font-size: 15px; color: #3b82f6; margin: 22px 0 10px; }
    .q { font-size: 13px; margin: 10px 0 4px; font-weight: 600; }
    .answer { border-bottom: 1px solid #cbd5e1; height: 24px; margin-bottom: 4px; }
    .box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; margin: 12px 0; }
    @media print { body { background: white; padding: 0; } .toolbar { display: none; } .page { box-shadow: none; padding: 16px; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="../index.html" class="btn btn-back">← Retour</a>
    <button onclick="window.print()" class="btn btn-print">🖨 Imprimer</button>
  </div>
  <div class="page">
    <h1>Fiche Théories</h1>
    <p class="subtitle">Playtime Academy</p>
    <div class="info">
      <div>Nom : <span></span></div>
      <div>Classe : <span></span></div>
    </div>

    <h2>Théorie 1</h2>
    <div class="box">
      <p class="q">Ma théorie :</p>
      <div class="answer"></div>
      <div class="answer"></div>
      <p class="q">Indices qui la soutiennent :</p>
      <div class="answer"></div>
      <div class="answer"></div>
      <div class="answer"></div>
    </div>

    <h2>Théorie 2</h2>
    <div class="box">
      <p class="q">Ma théorie :</p>
      <div class="answer"></div>
      <div class="answer"></div>
      <p class="q">Indices qui la soutiennent :</p>
      <div class="answer"></div>
      <div class="answer"></div>
      <div class="answer"></div>
    </div>

    <h2>Et toi, qu’est-ce que tu aimerais voir dans le Chapter 6 ?</h2>
    <div class="answer"></div>
    <div class="answer"></div>
    <div class="answer"></div>
    <div class="answer"></div>
  </div>
</body>
</html>
